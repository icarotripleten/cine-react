name: Teste

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  testes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Instalar as dependencias
        run: npm i

      - name: Rodar os test
        run: npm run test
    